<div class="admin-shell min-vh-100 bg-body">
  <header
    class="topbar navbar bg-body-tertiary border-bottom px-3 px-lg-4 gap-2"
  >
    <div class="d-flex align-items-center gap-2">
      <button
        type="button"
        class="btn btn-outline-primary d-lg-none"
        aria-controls="admin-menu"
        [attr.aria-expanded]="!menuCollapsed"
        (click)="toggleMenu()"
      >
        Menu
      </button>
      <div>
        <p class="small text-body-secondary mb-0">Painel administrativo</p>
        <h1 class="h5 mb-0">Dashboard</h1>
      </div>
    </div>

    <div class="d-flex align-items-center gap-3">
      <span class="d-none d-sm-block">
        <strong class="d-block">Administrador</strong>
        <small class="text-body-secondary">Conta principal</small>
      </span>
      <app-theme-picker />
    </div>
  </header>

  <aside
    id="admin-menu"
    class="sidebar d-lg-block"
    [ngbCollapse]="menuCollapsed"
  >
    <div
      class="sidebar-inner d-flex flex-column gap-4 p-3 bg-body-tertiary border-end border-bottom"
    >
      <div class="d-flex align-items-center gap-3 pb-3 border-bottom">
        <img src="favicon.svg" width="44" height="44" alt="" />
        <div>
          <strong class="d-block text-body-emphasis">Kupuassu</strong>
          <small class="text-body-secondary">Gestão contábil</small>
        </div>
      </div>

      <nav class="nav nav-pills flex-column gap-1" aria-label="Menu principal">
        <a
          routerLink="/admin/dashboard"
          routerLinkActive="active"
          ariaCurrentWhenActive="page"
          class="nav-link"
          (click)="closeMenu()"
        >
          <i class="bi bi-speedometer2 me-2" aria-hidden="true"></i>Dashboard
        </a>
        <a
          routerLink="/admin/blog"
          routerLinkActive="active"
          ariaCurrentWhenActive="page"
          class="nav-link"
          (click)="closeMenu()"
        >
          <i class="bi bi-journal-text me-2" aria-hidden="true"></i>Blog
        </a>
        <button type="button" class="nav-link text-start" disabled>
          <i class="bi bi-people me-2" aria-hidden="true"></i>Usuários
        </button>
        <button type="button" class="nav-link text-start" disabled>
          <i class="bi bi-buildings me-2" aria-hidden="true"></i>Clientes
        </button>
        <button type="button" class="nav-link text-start" disabled>
          <i class="bi bi-gear me-2" aria-hidden="true"></i>Configurações
        </button>
      </nav>

      <button
        type="button"
        class="btn btn-outline-primary mt-auto text-start"
        (click)="logout()"
      >
        <i class="bi bi-box-arrow-right me-2" aria-hidden="true"></i>Sair
      </button>
    </div>
  </aside>

  <main class="content-area p-3 p-md-4 p-xl-5">
    <router-outlet />
  </main>
</div>

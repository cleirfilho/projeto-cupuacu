<header class="site-header sticky-top">
  <nav
    class="navbar navbar-expand-lg navbar-light"
    aria-label="Navegação principal"
  >
    <div class="container">
      <a
        class="navbar-brand d-flex align-items-center gap-2"
        href="#inicio"
        (click)="closeMenu()"
      >
        <img src="favicon.svg" width="44" height="44" alt="" />
        <span>
          <strong>Kupuassu</strong>
          <small>Contabilidade inteligente</small>
        </span>
      </a>

      <button
        class="navbar-toggler"
        type="button"
        aria-label="Alternar menu"
        [attr.aria-expanded]="!menuCollapsed"
        (click)="menuCollapsed = !menuCollapsed"
      >
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" [ngbCollapse]="menuCollapsed">
        <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-1">
          <li class="nav-item">
            <a class="nav-link" href="#inicio" (click)="closeMenu()">Início</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#sobre" (click)="closeMenu()">Sobre</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#servicos" (click)="closeMenu()"
              >Serviços</a
            >
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#diferenciais" (click)="closeMenu()"
              >Diferenciais</a
            >
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#contato" (click)="closeMenu()"
              >Contato</a
            >
          </li>
        </ul>
        <a
          class="btn btn-primary ms-lg-3 mt-3 mt-lg-0"
          routerLink="/login"
          (click)="closeMenu()"
        >
          Área do Cliente
        </a>
      </div>
    </div>
  </nav>
</header>

<main>
  <app-hero />
  <app-sobre />
  <app-servicos />
  <app-diferenciais />
  <app-clientes />
  <app-contato />
</main>

<app-footer />

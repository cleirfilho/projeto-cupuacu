<section class="site-section clients-section">
  <div class="container text-center">
    <span class="section-kicker">Confiança construída</span>
    <h2 class="section-title mt-3">Empresas que Confiam em Nosso Trabalho</h2>
    <div class="client-grid mt-5" aria-label="Logos de clientes demonstrativos">
      @for (client of clients; track client) {
        <div class="client-logo">
          <i class="bi bi-buildings"></i><span>{{ client }}</span>
        </div>
      }
    </div>
  </div>
</section>

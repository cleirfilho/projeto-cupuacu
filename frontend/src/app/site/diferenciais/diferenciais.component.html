<section id="diferenciais" class="site-section bg-body-tertiary">
  <div class="container">
    <div class="row align-items-end g-4 mb-5">
      <div class="col-lg-7">
        <span class="section-kicker">Nossos diferenciais</span>
        <h2 class="section-title mt-3 mb-0">Por que escolher o Kupuassu?</h2>
      </div>
      <div class="col-lg-5">
        <p class="section-copy mb-0">
          Unimos conhecimento, tecnologia e proximidade para entregar uma
          contabilidade que gera confiança.
        </p>
      </div>
    </div>
    <div class="row g-4">
      @for (item of items; track item[1]) {
        <div class="col-sm-6 col-lg-4">
          <article
            class="d-flex gap-3 h-100 p-3 p-sm-4 border rounded-4 bg-body"
          >
            <i
              class="bi {{
                item[0]
              }} feature-icon d-inline-flex align-items-center justify-content-center flex-shrink-0 rounded-3 bg-primary-subtle text-primary-emphasis"
            ></i>
            <div>
              <h3 class="h6 fw-bold">{{ item[1] }}</h3>
              <p class="text-body-secondary small mb-0">{{ item[2] }}</p>
            </div>
          </article>
        </div>
      }
    </div>
  </div>
</section>

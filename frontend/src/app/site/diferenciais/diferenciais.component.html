<section id="diferenciais" class="site-section bg-white">
  <div class="container">
    <div class="row align-items-end g-4 mb-5">
      <div class="col-lg-7">
        <span class="section-kicker">Nossos diferenciais</span>
        <h2 class="section-title mt-3 mb-0">Por que escolher o Kupuassu?</h2>
      </div>
      <div class="col-lg-5">
        <p class="section-copy mb-0">
          Unimos conhecimento, tecnologia e proximidade para entregar uma
          contabilidade que gera confiança.
        </p>
      </div>
    </div>
    <div class="row g-4">
      @for (item of items; track item[1]) {
        <div class="col-sm-6 col-lg-4">
          <article class="difference-card h-100">
            <i class="bi {{ item[0] }}"></i>
            <div>
              <h3>{{ item[1] }}</h3>
              <p>{{ item[2] }}</p>
            </div>
          </article>
        </div>
      }
    </div>
  </div>
</section>

<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <script>
      (() => {
        let preference;
        try {
          preference = localStorage.getItem('kupuassu-theme');
        } catch {
          // Use the system preference when storage is unavailable.
        }
        const theme =
          preference === 'light' || preference === 'dark'
            ? preference
            : matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
        document.documentElement.setAttribute('data-bs-theme', theme);
      })();
    </script>
    <title>Kupuassu | Contabilidade Inteligente</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Kupuassu oferece serviços de contabilidade empresarial, consultoria tributária e soluções financeiras para empresas de todos os portes."
    />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
